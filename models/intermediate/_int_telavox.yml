version: 2

models:
  - name: int_date_spine
    description: One row per calendar date


    time_spine:
        standard_granularity_column: date_day

    columns:
      - name: date_day
        description: One calendar date per row.
        granularity: day
        data_tests:
          - unique
          - not_null


  - name: int_company_dates
    description: One row per company calendar date
    columns:
      - name: company_id
        description: One row per company event in the calendar
      - name: date_day
        description: One row per date

  - name: int_subscriptions_enriched
    description: One row per company subscription.
    columns:
      - name: company_id
        description: Primary key for related company
        data_tests:
          - not_null

      - name: subscription_id
        description: The specific subscription the information relates to.
        data_tests:
          - not_null

