models:
  - name: fct_daily_subscription_revenue
    description: Daily company-level subscription revenue fact table. The grain is one row per company_id per date_day. Converts subscription validity windows into daily active subscription and MRR values.

    semantic_model:
      enabled: true

    primary_entity: company_revenue_day
    agg_time_dimension: date_day

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - company_id
              - date_day
    columns:
      - name: company_id
        description: Primary key for the company that has a subscription
        entity: 
          name: company
          type: foreign
        data_tests:
          - not_null 
          - relationships:
              arguments: 
                to: ref('dim_companies')
                field: company_id
        
      - name: date_day
        description: One row per date of an active subscription
        dimension: 
          type: time
        granularity: day
        data_tests:
          - not_null 

      - name: active_mrr_sek
        description: Sum of monthly_price_sek for subscriptions active on date_day.


      - name: current_plan_type
        description: Active plan type on date_day, if available.
        dimension: 
          type: categorical

      - name: active_subscriptions
        description: Count of subscriptions active for the company on date_day.


    metrics: 
      - name: active_mrr_sek
        description: Total active monthly recurring revenue in SEK.
        type: simple 
        agg: sum 
        expr: active_mrr_sek

      - name: active_subscriptions
        description: Total active subscriptions.
        type: simple
        agg: sum 
        expr: active_subscriptions




  - name: fct_monthly_invoice_status
    description: Monthly company-level invoice health status fact table. The grain is one invoiced company_id per month. It turns invoice data into monthly invoice status and gives an insight into the health of each related invoice.

    semantic_model: 
      enabled: true


    primary_entity: company_invoice_month
    agg_time_dimension: invoice_month


    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
            - company_id
            - invoice_month

    columns:
      - name: company_id
        description: primary key for each company the invoices concern.
        entity: 
          name: company
          type: foreign

        data_tests:
          - not_null 
          - relationships:
              arguments: 
                to: ref('dim_companies')
                field: company_id 

      - name: invoice_month
        description: Provides the date of each month the company invoice concerns. 
        dimension: 
          type: time
        granularity: month
        data_tests:
          - not_null 


      - name: invoiced_amount_sek
        description: The amount of SEK invoiced per company per month.

      - name: total_invoices
        description: The amount of invoices the company has received for the month. 

      - name: paid_invoices
        description: The amount of paid invoices.

      - name: void_invoices
        description: The number of void invoices.

      - name: paid_late_invoices
        description: Invoices paid late. 

      - name: overdue_invoices
        description: Invoices that are overdue.

    metrics: 

    - name: invoiced_amount_sek
      description: The amount in SEK that has been invoiced to a company for the month. 
      type: simple
      agg: sum
      expr: invoiced_amount_sek
