version: 2


models:
  - name: fct_daily_platform_usage
    description: Daily company level platform usage. The grain is one row per company_id on each event_date. Includes selected product usage events such as voice calls, SMS, meetings, API-calls, customer-center events, and PBX updates. 


    semantic_model: 
      enabled: true


    primary_entity: company_event_date
    agg_time_dimension: event_date


    columns:
      - name: event_date
        description: the date each event takes place on. 
        dimension: 
          type: time
        granularity: day
        data_tests:
          - not_null

      - name: company_id
        description: primary key for company id that is responsible for each event.
        entity: 
          name: company
          type: foreign
        data_tests:
          - not_null 
  

      - name: total_events
        description: Total number of included platform events for the company on event_date.


      - name: voice_calls
        description: Count of voice_call_started events.


      - name: sms_events
        description: Count of sms_sent events.


      - name: sms_quantity
        description: Total SMS quantity sent, based on the quantity field for sms_sent events.


      - name: api_calls
        description: Count of api_call events.

      - name: contact_center_events
        description: Count of contact_center_events


      - name: meetings
        description: Total amount of meetings on date_day for the company.


      - name: pbx_updates
        description: Count of pbx_ubdates on date_day for the company.

      - name: voice_call_seconds
        description: Total amount of voice_call_seconds on date_day per company

      - name: meeting_seconds
        description: Total amount of meeting_seconds on date_day per company


      - name: active_users
        description: Distinct amount of active_users for the company on date_day.


    metrics:
      - name: total_events
        description: The total amount of platform events for one company
        type: simple
        agg: sum
        expr: total_events

      - name: voice_calls
        description: Counted number of voice calls for one company
        type: simple
        agg: count
        expr: voice_calls

      - name: sms_events
        description: Counted number of voice calls for one company
        type: simple
        agg: count
        expr: sms_events

      - name: sms_quantity
        description: Total amount of SMS's sent by one company
        type: simple
        agg: sum
        expr: sms_quantity


      - name: api_calls
        description: Counted total of API calls made by one company
        type: simple
        agg: count
        expr: api_calls


      - name: contact_center_events
        description: Counted total of different contact center events made by one company
        type: simple
        agg: count
        expr: contact_center_events


      - name: meetings
        description: Total amount of meetings on the specific date by one company
        type: simple
        agg: sum
        expr: meetings


      - name: pbx_updates
        description: Counted number of different pbx updates on the specific date by one company
        type: simple
        agg: count
        expr: pbx_updates

      - name: voice_call_seconds
        description: Total amount of voice call seconds on the specific date by one company
        type: simple
        agg: sum
        expr: voice_call_seconds


      - name: meeting_seconds
        description: Total amount of meetings seconds on the specific date by one company
        type: simple
        agg: sum
        expr: meeting_seconds



      - name: active_users
        description: Unique amount of active users on the specific date by one company
        type: simple
        agg: count_distinct
        expr: active_users


