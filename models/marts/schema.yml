version: 2

models:
  - name: mart_company_daily
    description: Company-level daily mart that combines revenue, product usage, support-ticket, invoice and customer health signals.
    The grain is one company per row per date_day. This model is intended for executive reporting, customer health monitoring, and cross-functional self-service analytics.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
        combination_of_columns:
        - date_day
        - company_id

    columns:
      - name: date_day
        description: Calendar date represented by the row.
        data_tests:
          - not_null 

      - name: company_id
        description: Unique company identifier. Together with date_day, defines the row grain.
        data_tests:
          - not_null 
          - relationships:
              to: ref('dim_companies')
              field: company_id

      - name: company_name
        description: Name of the company/account.

      - name: country
        description: Country associated with the company.

      - name: sales_segment
        description: Commercial customer segment, such as SMB, Mid-Market, or Enterprise.

      - name: active_mrr_sek
        description: >
          Active monthly recurring revenue in SEK for the company on date_day,
          calculated from active subscription records valid on that date.

      - name: current_plan_type
        description: Current active subscription plan type on date_day. Null if the company has no active plan.

      - name: total_events
        description: Total number of included platform events generated by the company on date_day.

      - name: voice_calls
        description: Count of voice call started events on date_day.

      - name: sms_quantity
        description: Total SMS quantity sent by the company on date_day.

      - name: api_calls
        description: Count of API call events on date_day.

      - name: daily_active_users
        description: Count of distinct users with at least one included platform event on date_day.

      - name: opened_tickets
        description: Count of support tickets opened by the company on date_day.

      - name: high_priority_tickets
        description: Count of support tickets opened on date_day with high or urgent priority.

      - name: invoiced_amount_sek
        description: Monthly invoice amount in SEK joined to each date within the invoice month.

      - name: overdue_invoices
        description: Number of overdue invoices for the company in the invoice month.

      - name: customer_health_status
        description: >
          Simple derived customer health classification based on MRR, overdue invoices,
          high-priority support tickets, and usage. Values are inactive, billing_risk,
          high_risk, usage_risk, or healthy.
        data_tests:
          - accepted_values:
              values: ['inactive', 'billing_risk', 'high_risk', 'usage_risk', 'healthy']